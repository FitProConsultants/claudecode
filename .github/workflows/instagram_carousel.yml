name: Instagram Carousel Automatique

on:
  schedule:
    # Tous les jours à 8h00 EST (13h00 UTC)
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Nombre de jours à regarder en arrière (défaut : 1)"
        required: false
        default: "1"
      max_items:
        description: "Nombre max d'images dans le carousel (2-10)"
        required: false
        default: "10"

jobs:
  create-carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: Créer le carousel Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAROUSEL_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '1' }}
          CAROUSEL_MAX_ITEMS: ${{ github.event.inputs.max_items || '10' }}
        run: python scripts/instagram_carousel.py
