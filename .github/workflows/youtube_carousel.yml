name: YouTube Carousel Auto-Generator

on:
  push:
    paths:
      - 'transcripts/**.txt'  # Se déclenche quand vous ajoutez un transcript

  workflow_dispatch:
    inputs:
      transcript_file:
        description: 'Chemin du fichier transcript (ex: transcripts/ma-video.txt)'
        required: true

jobs:
  generate-carousel:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: pip install requests==2.31.0

      # ─── Déclenchement automatique (push d'un .txt dans transcripts/) ────
      - name: Détecter les nouveaux fichiers transcript
        if: github.event_name == 'push'
        id: detect
        run: |
          # Récupère les fichiers .txt ajoutés dans transcripts/ lors du push
          NEW_FILES=$(git diff --name-only --diff-filter=A ${{ github.event.before }} ${{ github.sha }} -- 'transcripts/*.txt' 2>/dev/null || git show --name-only --diff-filter=A --format="" ${{ github.sha }} -- 'transcripts/*.txt')
          echo "Nouveaux fichiers: $NEW_FILES"
          echo "files=$NEW_FILES" >> $GITHUB_OUTPUT

      - name: Générer le carousel pour chaque nouveau transcript (push)
        if: github.event_name == 'push' && steps.detect.outputs.files != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          for file in ${{ steps.detect.outputs.files }}; do
            echo "Traitement de: $file"
            python scripts/youtube_carousel.py "$file"
          done

      # ─── Déclenchement manuel ─────────────────────────────────────────────
      - name: Générer le carousel (déclenchement manuel)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python scripts/youtube_carousel.py "${{ github.event.inputs.transcript_file }}"

      # ─── Commit du carousel généré ────────────────────────────────────────
      - name: Sauvegarder le carousel dans le dépôt
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions — Carousel Bot"
          git add data/carousels/
          git diff --staged --quiet || git commit -m "🎠 Carousel généré automatiquement"
          git push -u origin HEAD
