name: YouTube Carousel Auto-Generator

on:
  # Vérification automatique toutes les heures
  schedule:
    - cron: '0 * * * *'

  # Déclenchement manuel (avec ou sans vidéo spécifique)
  workflow_dispatch:
    inputs:
      video_id:
        description: 'ID de la vidéo YouTube (ex: dQw4w9WgXcQ) — laisser vide pour la détection auto'
        required: false
        default: ''
      video_title:
        description: 'Titre de la vidéo (optionnel, utilisé seulement si video_id est fourni)'
        required: false
        default: ''

jobs:
  generate-carousel:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Pour committer le fichier last_processed_video.txt

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          pip install \
            youtube-transcript-api==0.6.3 \
            google-api-python-client==2.118.0 \
            requests==2.31.0

      # ─── Mode manuel : vidéo spécifique ───────────────────────────────────
      - name: Générer le carousel pour la vidéo fournie
        if: ${{ github.event.inputs.video_id != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/youtube_carousel.py \
            "${{ github.event.inputs.video_id }}" \
            "${{ github.event.inputs.video_title }}"

      # ─── Mode automatique : détection de nouvelles vidéos ─────────────────
      - name: Vérifier et traiter les nouvelles vidéos
        if: ${{ github.event.inputs.video_id == '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: |
          python scripts/youtube_carousel.py

      # ─── Commit des fichiers générés ──────────────────────────────────────
      - name: Sauvegarder les carousels générés
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions — YouTube Carousel Bot"
          git add data/
          git diff --staged --quiet || git commit -m "🎠 Carousel auto-généré depuis YouTube"
          git push -u origin HEAD
